<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    // 旧链接兼容：存在同名静态页时直接跳转
    if (id && articles.some(a => a.id === id)) {
        location.replace('articles/' + encodeURIComponent(id) + '.html');
        return;
    }
    const article = articles.find(a => a.id === id);
    const container = document.getElementById('articleContent');
    const titleEl = document.getElementById('pageTitle');
    if (!article) {
        container.innerHTML = '<h1>文章未找到</h1><p style="color:#6f6253;">请返回<a href="articles.html">文章列表</a>。</p>';
        return;
    }
    titleEl.textContent = article.title + ' — 循史漫记';
    container.innerHTML = `
        <h1>${article.title}</h1>
        <div class="article-meta">
            <span>${article.date}</span>
            <span>${article.category}</span>
            <span>${article.tags.map(t => `<span class="tag">${t}</span>`).join('')}</span>
        </div>
        <div class="article-body">${article.content}</div>
        <div style="margin-top:40px;padding-top:20px;border-top:1px solid #d4c5a9;">
            <a href="articles.html">← 返回文章列表</a>
        </div>
    `;
});
</script>
