            <h1>“陈寅恪：‘独立之精神，自由之思想’”</h1>
            <div class="article-meta">
                <span>近代·中国</span>
                <span><span class="tag">近代</span><span class="tag">史学家</span><span class="tag">学术精神</span></span>
            </div>
            <div class="article-body">“陈寅恪（1890–1969），江西义宁人，中国近代最负盛名的历史学家之一。他通晓十多种语言，包括梵文、巴利文、藏文、蒙古文等，在魏晋南北朝史、隋唐史、蒙古史等领域做出了开创性贡献。

陈寅恪治学最重‘史料批判’，主张‘诗史互证’。晚年在失明膑足的情况下仍坚持著述，为民国学术界保留了弥足珍贵的尊严。”</div>
