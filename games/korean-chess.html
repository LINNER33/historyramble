<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>朝鲜象棋</title>
<style>
:root { --bg:#f5efe3; --panel:#ffffff; --line:#6b5138; --cho:#b8382a; --han:#21548f; --accent:#c8a45c; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:#333; font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif; }
header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid #e2d9c8; flex-wrap:wrap; }
h1 { font-size:18px; margin:0 8px 0 0; }
main { display:flex; gap:16px; padding:16px; align-items:flex-start; flex-wrap:wrap; max-width:1120px; margin:0 auto; }
.board-wrap { position:relative; background:var(--panel); padding:8px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
svg#board { width:min(92vw,540px); height:auto; display:block; user-select:none; }
aside { flex:1; min-width:290px; }
button { font-size:14px; padding:6px 11px; border-radius:6px; border:1px solid #bfae94; background:#fff; cursor:pointer; }
button:hover:not(:disabled) { background:#f3e8d2; }
button:disabled { opacity:.45; cursor:not-allowed; }
button.active { background:var(--accent); border-color:#9a7a33; }
.row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
.row .lbl { font-size:13px; color:#777; min-width:56px; }
.panel { background:var(--panel); border-radius:10px; padding:10px 12px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.panel h3 { margin:0 0 8px; font-size:15px; }
#status { font-size:15px; line-height:1.7; }
#status .k { color:#777; margin-right:6px; }
.k-info { color:#333; } .k-check { color:#c0392b; font-weight:bold; } .k-bikjang { color:#8e44ad; font-weight:bold; } .k-end { color:#1e8449; font-weight:bold; }
#notation { max-height:320px; overflow:auto; font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.8; margin:0; padding-left:8px; list-style:none; }
#notation li.cur { background:#fff3cd; font-weight:bold; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:30; }
.overlay .card { background:#fff; padding:22px 26px; border-radius:12px; max-width:440px; text-align:center; line-height:1.8; }
.overlay h2 { margin:0 0 10px; font-size:18px; }
.setup-title { font-size:15px; margin-bottom:10px; }
.formation { display:flex; gap:8px; flex-wrap:wrap; }
.formation button { display:flex; flex-direction:column; gap:2px; align-items:center; }
.formation .pv { font-size:11px; color:#888; }
.hide { display:none !important; }
.seat { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; padding:5px 10px; margin:3px 0; border-radius:6px; background:#faf5ea; color:#5b4a35; border:1px solid #e6dbc6; }
.seat .who { font-weight:bold; }
.seat .st { color:#8a7a63; }
.seat.active { background:#f3dfb2; border-color:#c8a45c; color:#3d2f1d; box-shadow:0 0 0 2px rgba(200,164,92,.35); }
.seat.active .st { color:#8a5a12; font-weight:bold; }
.seat .tag { font-size:11px; color:#8a7a63; }
.note { font-size:12px; color:#888; line-height:1.6; }
#rules { position:relative; z-index:40; }
.rules-card { max-width:720px; width:min(92vw,720px); max-height:82vh; overflow:auto; text-align:left; padding:20px 24px; }
.rules-card h2 { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 12px; }
.rules-close { font-size:18px; line-height:1; padding:2px 9px; border-radius:6px; }
.rules h3 { font-size:15px; margin:16px 0 6px; color:#7a5a2e; }
.rules ul { margin:0; padding-left:20px; }
.rules li { font-size:14px; line-height:1.85; margin-bottom:4px; }
.rules-overlay { align-items:flex-start; padding-top:5vh; overflow:auto; }
