<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>围棋 · 人机对战</title>
<style>
:root{
  --bg:#15181c; --panel:#1f242a; --panel2:#262c34; --line:#333a44;
  --text:#e9edf2; --dim:#9aa5b1; --accent:#d9a755; --accent2:#e3b264;
  --ok:#4fa86a; --warn:#d98b3a; --err:#d15c5c;
  --wood1:#e6bb6d; --wood2:#d8a854; --woodLine:#8a6224;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,"Microsoft YaHei","PingFang SC","Noto Sans SC","Source Han Sans SC",sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
.app{flex:1;display:flex;flex-direction:column;min-height:0}

header{
  padding:14px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  background:linear-gradient(180deg,#1b2027,#171b21);
}
header h1{font-size:17px;font-weight:600;letter-spacing:.5px}
header .sub{color:var(--dim);font-size:12px}
header .spacer{flex:1}

main{flex:1;display:flex;min-height:0;overflow:hidden}

/* ===== 配置面板 ===== */
#configPanel{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; overflow:auto;
}
.cfgCard{
  width:100%; max-width:520px; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:26px 26px 20px;
}
.cfgCard h2{font-size:15px;font-weight:600;margin-bottom:18px;color:var(--accent2)}
.cfgGroup{margin-bottom:18px}
.cfgGroup .label{font-size:12px;color:var(--dim);margin-bottom:8px;letter-spacing:.5px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  padding:8px 15px; border-radius:9px; cursor:pointer; font-size:13px;
  font-family:inherit; transition:all .13s; line-height:1.4;
}
.opt:hover{border-color:#4a5462;background:#2c333c}
.opt.on{background:var(--accent);border-color:var(--accent);color:#1d1a12;font-weight:600}
.opt small{display:block;font-size:11px;opacity:.72;font-weight:400;margin-top:1px}
.opt.on small{opacity:.8}
.optDel{font-size:13px}
.cfgNote{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.55}
.cfgActions{display:flex;gap:10px;margin-top:24px}
.btn{
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  padding:9px 18px; border-radius:9px; cursor:pointer; font-size:13px;
  font-family:inherit; transition:all .13s;
}
.btn:hover:not(:disabled){background:#2f3741;border-color:#4d5867}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1a12;font-weight:600}
.btn.primary:hover:not(:disabled){background:#e8bd6b;border-color:#e8bd6b}
.btn.ghost{background:transparent}
.btn.danger:hover:not(:disabled){border-color:var(--err);color:#ef9a9a}

/* ===== 对局面板 ===== */
#gamePanel{flex:1;display:flex;min-height:0;overflow:hidden}
.boardWrap{
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:22px; overflow:auto; position:relative; min-width:0; min-height:0;
}
#board{
  display:block; border-radius:6px; cursor:pointer;
  box-shadow:0 10px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07);
  touch-action:manipulation;
}
#board.locked{cursor:default}

aside{
  width:272px; flex:0 0 272px; border-left:1px solid var(--line);
  background:var(--panel); padding:18px 16px; overflow:auto;
  display:flex; flex-direction:column; gap:14px;
}
.sideBlock{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.sideBlock .cap{font-size:11px;color:var(--dim);letter-spacing:.6px;margin-bottom:6px}
.turnLine{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.stoneDot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;border:1px solid #0006}
.stoneDot.b{background:radial-gradient(circle at 33% 30%,#5a5a5a,#0c0c0c 72%)}
.stoneDot.w{background:radial-gradient(circle at 33% 30%,#fff,#cdcdcd 72%);border-color:#0002}
.turnTag{font-size:11.5px;color:var(--dim);font-weight:400;margin-left:auto}
.thinkTag{font-size:12px;color:var(--accent2);margin-top:6px;display:none}
.thinkTag.on{display:block}

.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-variant-numeric:tabular-nums}
.kv.hl span:last-child{color:var(--accent2);font-weight:600}

.actions{display:flex;flex-direction:column;gap:8px}
.actions .row{display:flex;gap:8px}
.actions .row .btn{flex:1;padding:9px 0}

.hintBox{
  font-size:12px;color:var(--dim);background:rgba(255,255,255,.03);
  border:1px dashed var(--line);border-radius:8px;padding:9px 11px;line-height:1.55;
  min-height:52px;
}
.hintBox.on{color:#ffd18a;border-color:#6a5324;background:rgba(217,167,85,.09)}
.hintBox.err{color:#f2a0a0;border-color:#6e3434;background:rgba(209,92,92,.1)}
.hintBox.ok{color:#9fe0b4;border-color:#2f5a3d;background:rgba(79,168,106,.1)}

.markBar{display:none;flex-direction:column;gap:8px}
.markBar.on{display:flex}
.markBar .tip{font-size:12px;color:var(--accent2);line-height:1.5}
.markBar .row{display:flex;gap:8px}
.markBar .row .btn{flex:1}

.resultBox{display:none;flex-direction:column;gap:10px}
.resultBox.on{display:flex}
.resultTitle{font-size:15px;font-weight:700;color:var(--accent2);letter-spacing:.5px}
.resultDetail{font-size:12.5px;color:var(--dim);line-height:1.7}
.resultDetail b{color:var(--text);font-weight:600}

/* ===== 弹窗 ===== */
#modal{
  position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:60;
  display:none; align-items:center; justify-content:center; padding:20px;
  backdrop-filter:blur(2px);
}
#modal.on{display:flex}
.modalBox{
  width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line);
  border-radius:13px; padding:22px 22px 18px; box-shadow:0 18px 50px rgba(0,0,0,.6);
}
.modalBox h3{font-size:15px;margin-bottom:10px;font-weight:600}
.modalBox p{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:18px;white-space:pre-line}
.modalBox .row{display:flex;gap:9px;justify-content:flex-end}
.modalBox .row .btn{min-width:88px;padding:8px 16px}

/* ===== 轻提示 ===== */
#toast{
  position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(8px);
  background:#2a313a; border:1px solid #45505f; color:var(--text);
  padding:9px 18px; border-radius:9px; font-size:13px; z-index:80;
  opacity:0; pointer-events:none; transition:opacity .2s,transform .2s;
  box-shadow:0 8px 24px rgba(0,0,0,.45); max-width:88vw;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:880px){
  #gamePanel{flex-direction:column}
  aside{width:auto;flex:0 0 auto;border-left:none;border-top:1px solid var(--line);max-height:46vh}
  .boardWrap{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>围棋 · 人机对战</h1>
    <span class="sub">中国规则 · 离线单文件</span>
    <span class="spacer"></span>
    <button class="btn ghost" id="btnBackCfg" style="display:none">返回配置</button>
  </header>

  <main>
    <section id="configPanel">
      <div class="cfgCard">
        <h2>新局设置</h2>

        <div class="cfgGroup">
          <div class="label">棋盘尺寸</div>
          <div class="opts" id="optSize">
            <button class="opt on" data-v="19">19 路<small>361 点 · 标准盘</small></button>
            <button class="opt" data-v="13">13 路<small>169 点</small></button>
            <button class="opt" data-v="9">9 路<small>81 点</small></button>
          </div>
        </div>

        <div class="cfgGroup">
          <div class="label">我方执子</div>
          <div class="opts" id="optColor">
            <button class="opt on" data-v="1">执黑<small>我先下</small></button>
            <button class="opt" data-v="2">执白<small>AI 先下</small></button>
          </div>
        </div>

        <div class="cfgGroup">
          <div class="label">AI 难度</div>
          <div class="opts" id="optLevel">
            <button class="opt" data-v="easy">初级<small>会走随手棋</small></button>
            <button class="opt on" data-v="medium">中级<small>懂基本棋理</small></button>
            <button class="opt" data-v="hard">高级<small>需认真对待</small></button>
          </div>
        </div>

        <div class="cfgGroup">
          <div class="label">让子</div>
          <div class="opts" id="optHandicap">
            <button class="opt on" data-v="0">不让子</button>
            <button class="opt" data-v="2">2 子</button>
            <button class="opt" data-v="3">3 子</button>
            <button class="opt" data-v="4">4 子</button>
            <button class="opt" data-v="5">5 子</button>
            <button class="opt" data-v="6">6 子</button>
            <button class="opt" data-v="7">7 子</button>
            <button class="opt" data-v="8">8 子</button>
            <button class="opt" data-v="9">9 子</button>
          </div>
          <div class="cfgNote" id="handicapNote">让子时黑方在星位预摆棋子，白方先行，且不贴目。</div>
        </div>

        <div class="cfgNote" id="komiNote"></div>

        <div class="cfgActions">
          <button class="btn primary" id="btnStart">开始对局</button>
        </div>
      </div>
    </section>

    <section id="gamePanel" style="display:none">
      <div class="boardWrap">
        <canvas id="board"></canvas>
      </div>
      <aside>
        <div class="sideBlock">
          <div class="cap">当前轮到</div>
          <div class="turnLine">
            <span class="stoneDot" id="turnDot"></span>
            <span id="turnText">黑棋</span>
            <span class="turnTag" id="turnTag"></span>
          </div>
          <div class="thinkTag" id="thinkTag">AI 思考中…</div>
        </div>

        <div class="sideBlock">
          <div class="kv"><span>手数</span><span id="stMoves">0</span></div>
          <div class="kv"><span>黑方提子</span><span id="stCapB">0</span></div>
          <div class="kv"><span>白方提子</span><span id="stCapW">0</span></div>
          <div class="kv"><span>贴目</span><span id="stKomi"></span></div>
          <div class="kv"><span>难度</span><span id="stLevel"></span></div>
          <div class="kv" id="rowHc" style="display:none"><span>让子</span><span id="stHc"></span></div>
        </div>

        <div class="hintBox" id="hintBox">点击棋盘交叉点落子。</div>

        <div class="markBar" id="markBar">
          <div class="tip" id="markTip">终局：点击棋子标记死子（再点一次取消），确认后按数子法计算。</div>
          <div class="row">
            <button class="btn" id="btnAutoDead">自动预估</button>
            <button class="btn primary" id="btnConfirmScore">确认并数子</button>
          </div>
        </div>

        <div class="resultBox" id="resultBox">
          <div class="resultTitle" id="resultTitle"></div>
          <div class="resultDetail" id="resultDetail"></div>
        </div>

        <div class="actions">
          <div class="row">
            <button class="btn" id="btnPass">虚手</button>
            <button class="btn" id="btnUndo">悔棋</button>
          </div>
          <div class="row">
            <button class="btn" id="btnNewGame">重新开局</button>
            <button class="btn danger" id="btnResign">认输</button>
          </div>
          <button class="btn" id="btnExport">导出棋谱（SGF）</button>
        </div>
      </aside>
    </section>
  </main>
</div>

<div id="modal">
  <div class="modalBox">
    <h3 id="mdTitle">确认</h3>
    <p id="mdText"></p>
    <div class="row">
      <button class="btn" id="mdCancel">取消</button>
      <button class="btn primary" id="mdOk">确认</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>/* ===== 围棋规则引擎（中国规则） =====
 * 纯逻辑层，不依赖 DOM。Node 与浏览器通用。
 * 口径：连接块+气判提子、先提对方后判自身、禁止全局同形（状态哈希）、
 *      禁着点先提后判、数子法（活子+围空、公气各半）。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.WQRules = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var BLACK = 1, WHITE = 2;
  function other(c) { return c === BLACK ? WHITE : BLACK; }

  /* Zobrist 表：同一尺寸内确定性生成，便于跨进程一致 */
  var ZOB = {};
  function zobrist(n) {
    if (ZOB[n]) return ZOB[n];
    var seed = (n * 2654435761) >>> 0;
    function rnd() { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed; }
    var w = n + 2, N = w * w;
    var t = [new Int32Array(N), new Int32Array(N), new Int32Array(N)];
    for (var c = 1; c <= 2; c++) for (var i = 0; i < N; i++) t[c][i] = rnd() | 0;
    var side = [0, rnd() | 0, rnd() | 0];
    ZOB[n] = { stone: t, side: side };
    return ZOB[n];
  }

  function Board(n) {
    this.n = n; this.w = n + 2; this.N = this.w * this.w;
    this.stones = new Int8Array(this.N);
    this.hash = 0;
    this.z = zobrist(n);
    // 预计算邻居表，避免热点路径分配
    this.nbT = new Array(this.N);
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var p = (y + 1) * this.w + (x + 1), a = [];
      if (y > 0) a.push(p - this.w);
      if (y < n - 1) a.push(p + this.w);
      if (x > 0) a.push(p - 1);
      if (x < n - 1) a.push(p + 1);
      this.nbT[p] = a;
    }
  }

  Board.prototype.idx = function (x, y) { return (y + 1) * this.w + (x + 1); };
  Board.prototype.xOf = function (p) { return p % this.w - 1; };
  Board.prototype.yOf = function (p) { return Math.floor(p / this.w) - 1; };
  Board.prototype.get = function (x, y) { return this.stones[this.idx(x, y)]; };
  Board.prototype.copyFrom = function (o) {
    this.stones.set(o.stones); this.hash = o.hash;
  };
  Board.prototype.clone = function () { var b = new Board(this.n); b.copyFrom(this); return b; };

  /* 取点所在连接块及其气（气去重，避免同气点被重复计数） */
  var _gpBufs = {};
  function gpBuf(N) {
    var b = _gpBufs[N];
    if (!b) { b = { seen: new Uint8Array(N), lib: new Uint8Array(N), tS: [], tL: [] }; _gpBufs[N] = b; }
    return b;
  }
  Board.prototype.groupAt = function (p) {
    var st = this.stones, col = st[p];
    if (col === 0) return null;
    var buf = gpBuf(this.N), seen = buf.seen, lib = buf.lib;
    var touchS = buf.tS, touchL = buf.tL;
    // 只清理用到的位置，避免整块清零
    var stones = [], libs = [], stack = [p];
    seen[p] = 1; touchS.push(p); touchL.push(-1);
    while (stack.length) {
      var q = stack.pop(); stones.push(q);
      var nb = this.nbT[q];
      for (var i = 0; i < nb.length; i++) {
        var r = nb[i], v = st[r];
        if (v === 0) {
          if (!lib[r]) { lib[r] = 1; libs.push(r); touchL.push(r); }
        } else if (v === col && !seen[r]) { seen[r] = 1; stack.push(r); touchS.push(r); }
      }
    }
    // 复位缓冲区，供下次复用
    for (var a = 0; a < touchS.length; a++) seen[touchS[a]] = 0;
    for (var b = 0; b < touchL.length; b++) if (touchL[b] >= 0) lib[touchL[b]] = 0;
    touchS.length = 0; touchL.length = 0;
    return { color: col, stones: stones, libs: libs };
  };


  /* 落子（不做同形校验，由上层 Game 负责）。返回 {ok, reason, captured, rec}
   * 顺序：先提对方 → 再判自身无气（禁着点） */
  Board.prototype.play = function (x, y, c) {
    if (x < 0 || y < 0 || x >= this.n || y >= this.n) return { ok: false, reason: 'out' };
    var p = this.idx(x, y);
    if (this.stones[p] !== 0) return { ok: false, reason: 'occupied' };
    var st = this.stones, prevHash = this.hash, zs = this.z.stone[c];
    st[p] = c; this.hash ^= zs[p];
    var captured = [], occ = other(c), zi = this.z.stone[occ];

    var nb = this.nbT[p];
    for (var i = 0; i < nb.length; i++) {
      var q = nb[i];
      if (st[q] !== occ) continue;
      var g = this.groupAt(q);
      if (g.libs.length === 0) {
        for (var k = 0; k < g.stones.length; k++) { var s = g.stones[k]; st[s] = 0; this.hash ^= zi[s]; captured.push(s); }
      }
    }
    // 判自身：先提后判
    if (captured.length === 0) {
      var own = this.groupAt(p);
      if (own.libs.length === 0) {
        st[p] = 0; this.hash ^= zs[p];
        return { ok: false, reason: 'suicide' };
      }
    } else {
      var own2 = this.groupAt(p);
      if (own2.libs.length === 0) { // 提了对方但自己也无气（理论上不会发生）
        for (var m = 0; m < captured.length; m++) { st[captured[m]] = occ; this.hash ^= zi[captured[m]]; }
        st[p] = 0; this.hash ^= zs[p];
        return { ok: false, reason: 'suicide' };
      }
    }
    return { ok: true, captured: captured, rec: { p: p, c: c, captured: captured, prevHash: prevHash } };
  };

  Board.prototype.undo = function (rec) {
    var st = this.stones;
    st[rec.p] = 0;
    var occ = other(rec.c), zi = this.z.stone[occ];
    for (var i = 0; i < rec.captured.length; i++) { st[rec.captured[i]] = occ; this.hash ^= zi[rec.captured[i]]; }
    this.hash = rec.prevHash;
  };

  /* 局面哈希（含轮次）：禁止全局同形以它为准 */
  Board.prototype.positionHash = function (toPlay) { return this.hash ^ this.z.side[toPlay]; };

  /* 甜点/星位（0 基坐标） */
  var STAR_DEF = { 19: [3, 9, 15], 13: [3, 6, 9], 9: [2, 4, 6] };
  function starLines(n) { return STAR_DEF[n] || []; }
  /* 星位：19 路九星；13 路/9 路各四角星 + 天元 = 5 点 */
  function starPoints(n) {
    var L = starLines(n), out = [];
    if (n === 19) {
      for (var i = 0; i < L.length; i++) for (var j = 0; j < L.length; j++) out.push([L[i], L[j]]);
      return out;
    }
    var lo = L[0], hi = L[L.length - 1], mid = (n - 1) / 2;
    out.push([lo, lo], [hi, lo], [lo, hi], [hi, hi], [mid, mid]);
    return out;
  }

  /* 让子点序（常规顺序，0 基） */
  function handicapPoints(n, count) {
    var s = starPoints(n), m = {};
    function key(x, y) { return x + ',' + y; }
    // 星位按行列相对位置索引
    for (var i = 0; i < s.length; i++) { var a = s[i]; m[key(a[0], a[1])] = a; }
    var L2 = starLines(n), lo = L2[0], hi = L2[L2.length - 1], mid = (n - 1) / 2;
    var seq = [];
    // 常规让子摆子次序（0 基、y 向下）：
    // 2 子 = 右上 + 左下；3 子 +左上；4 子 +右下；5 子 +天元；
    // 6 子 +左边；7 子 +右边；8 子 +下边；9 子 +上边。
    // SGF 记法下 2 子为 AB[pd][dp]，4 子为 AB[pd][dp][dd][pp]。
    seq.push([hi, lo]);   // 右上
    seq.push([lo, hi]);   // 左下
    seq.push([lo, lo]);   // 左上
    seq.push([hi, hi]);   // 右下
    seq.push([mid, mid]); // 天元
    seq.push([lo, mid]);  // 左边
    seq.push([hi, mid]);  // 右边
    seq.push([mid, hi]);  // 下边
    seq.push([mid, lo]);  // 上边
    var out = [];
    for (var k = 0; k < seq.length && out.length < count; k++) if (m[key(seq[k][0], seq[k][1])]) out.push(seq[k]);
    return out;
  }
  /* 各尺寸可支持的最大让子数 = 星位数（19 路 9、13/9 路 5） */
  function maxHandicap(n) { return starPoints(n).length; }

    ctx.stroke();

    ctx.strokeStyle = '#7a551d';
    ctx.lineWidth = Math.max(1.4, cell * 0.075);
    ctx.strokeRect(pad, pad, px - pad * 2, px - pad * 2);

    var stars = R.starPoints(n), sr = Math.max(2.2, cell * 0.1);
    ctx.fillStyle = '#5f431a';
    for (var s = 0; s < stars.length; s++) {
      ctx.beginPath();
      ctx.arc(pt(stars[s][0]), pt(stars[s][1]), sr, 0, Math.PI * 2);
      ctx.fill();
    }

    var r = cell * 0.465;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        var c = game.board.get(x, y);
        if (!c) continue;
        drawStone(ctx, pt(x), pt(y), r, c);
      }
    }

    var lm = null;
    for (var k = game.moves.length - 1; k >= 0; k--) {
      if (!game.moves[k].pass) { lm = game.moves[k]; break; }
    }
    if (lm) {
      var cx = pt(lm.x), cy = pt(lm.y);
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(2.4, r * 0.3), 0, Math.PI * 2);
      ctx.fillStyle = lm.c === BLACK ? '#ff8a4c' : '#d94f2b';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(2.4, r * 0.3), 0, Math.PI * 2);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.stroke();
    }

    if (markMode) {
      for (var key in deadSet) {
        if (!deadSet[key]) continue;
        var xy = key.split(','), dx = pt(+xy[0]), dy = pt(+xy[1]);
        var half = r * 0.55;
        ctx.strokeStyle = 'rgba(200,40,40,.92)';
        ctx.lineWidth = Math.max(1.6, r * 0.14);
        ctx.beginPath();
        ctx.moveTo(dx - half, dy - half); ctx.lineTo(dx + half, dy + half);
        ctx.moveTo(dx + half, dy - half); ctx.lineTo(dx - half, dy + half);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(dx, dy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(200,40,40,.55)';
        ctx.lineWidth = Math.max(1.2, r * 0.09);
        ctx.stroke();
      }
    }
  }

  /* ---------- 侧栏 ---------- */
  function updateSidebar() {
    if (!game) return;
    var dot = $('turnDot'), txt = $('turnText'), tag = $('turnTag');
    if (game.ended) {
      dot.style.visibility = 'hidden';
      txt.textContent = '对局结束';
      tag.textContent = '';
    } else {
      dot.style.visibility = 'visible';
      dot.className = 'stoneDot ' + (game.toPlay === BLACK ? 'b' : 'w');
      txt.textContent = (game.toPlay === BLACK ? '黑棋' : '白棋');
      tag.textContent = '（' + (game.toPlay === cfg.human ? '你' : 'AI') + '行棋）';
    }
    $('stMoves').textContent = game.moves.length;
    $('stCapB').textContent = game.captures[BLACK];
    $('stCapW').textContent = game.captures[WHITE];
    $('stKomi').textContent = game.komi > 0
      ? game.komi + ' 目（' + R.fmtZi(game.komi / 2) + ' 子）'
      : '不贴目';
    $('stLevel').textContent = levelName(cfg.level);
    if (game.handicap > 1) {
      $('rowHc').style.display = '';
      $('stHc').textContent = game.handicap + ' 子';
    } else {
      $('rowHc').style.display = 'none';
    }
    $('thinkTag').classList.toggle('on', aiThinking);
    $('board').classList.toggle('locked', aiThinking || markMode || game.ended);
    $('btnUndo').disabled = aiThinking || !game.moves.length;
    $('btnPass').disabled = aiThinking || game.ended || markMode;
    $('btnResign').disabled = aiThinking || game.ended || markMode;
    $('btnNewGame').disabled = aiThinking;
  }

  /* ---------- 非法提示 ---------- */
  var REASON = {
    occupied: '该交叉点已有棋子，请换一处落子。',
    suicide: '禁着点：此处落子后己方棋子无气，且不能提掉对方棋子。',
    ko: '劫争：需先在别处落子，不能立即回提。',
    ended: '对局已结束，无法继续落子。',
    out: '落子位置超出棋盘范围。'
  };

  /* ---------- 玩家落子 ---------- */
  function tryPlay(x, y) {
    if (!game || game.ended || aiThinking) return { ok: false, reason: 'busy' };
    if (game.toPlay !== cfg.human) return { ok: false, reason: 'notyour' };
    var chk = game.check(x, y);
    if (!chk.ok) {
      var msg = REASON[chk.reason] || '此处不能落子。';
      hint(msg, 'err'); toast(msg);
      return chk;
    }
    var mv = game.move(x, y);
    if (!mv.ok) { hint(REASON[mv.reason] || '此处不能落子。', 'err'); return mv; }
    var caps = mv.captured.length;
    hint(caps > 0 ? '落子成功，提掉对方 ' + caps + ' 子。' : '落子成功。', caps > 0 ? 'ok' : '');
    render(); updateSidebar();
    if (game.ended) { enterMarkMode(); return mv; }
    scheduleAI();
    return mv;
  }

  /* ---------- AI ---------- */
  function scheduleAI() {
    if (!game || game.ended) return;
    if (game.toPlay === cfg.human) return;
    aiThinking = true;
    updateSidebar();
    if (aiTimer) clearTimeout(aiTimer);
    aiTimer = setTimeout(runAI, 30);
  }

  function runAI() {
    aiTimer = null;
    if (!game || game.ended) { aiThinking = false; updateSidebar(); return; }
    if (game.toPlay === cfg.human) { aiThinking = false; updateSidebar(); return; }
    var t0 = Date.now();
    var mv = AI.choose(game, cfg.level, rng);
    var dt = Date.now() - t0;
    if (dt > stats.maxThinkMs) stats.maxThinkMs = dt;

    if (!mv || mv.pass) { applyAIMove(null); return; }
    var chk = game.check(mv.x, mv.y);
    if (!chk.ok) {
      // 兜底：AI 不得下非法手。取一个合法点，否则虚手。
      stats.illegalAI++;
      var legal = [];
      for (var y = 0; y < game.size; y++) for (var x = 0; x < game.size; x++) {
        if (game.check(x, y).ok) legal.push([x, y]);
      }
      if (legal.length) {
        var lp = legal[rng.int(legal.length)];
        applyAIMove({ x: lp[0], y: lp[1] });
      } else applyAIMove(null);
      return;
    }
    applyAIMove(mv);
  }

  function applyAIMove(mv) {
    stats.aiMoves++;
    var res;
    if (!mv) res = game.pass();
    else {
      res = game.move(mv.x, mv.y);
      if (!res.ok) res = game.pass();
    }
    aiThinking = false;
    if (mv) {
      var caps = (res.captured || []).length;
      hint('AI（' + levelName(cfg.level) + '）落子' + (caps ? '，提掉你 ' + caps + ' 子' : '') + '。', caps ? 'warn' : '');
    } else {
      hint('AI（' + levelName(cfg.level) + '）虚手。', '');
    }
    render(); updateSidebar();
    if (game.ended) { enterMarkMode(); return; }
    if (game.toPlay !== cfg.human) scheduleAI();
  }

  /* ---------- 玩家虚手 ---------- */
  function playerPass() {
    if (!game || game.ended || aiThinking || markMode) return null;
    if (game.toPlay !== cfg.human) return null;
    var res = game.pass();
    hint('你选择虚手。' + (game.passes >= 1 ? '（双方连续虚手即进入终局）' : ''), '');
    render(); updateSidebar();
    if (game.ended) { enterMarkMode(); return res; }
    scheduleAI();
    return res;
  }

  /* ---------- 悔棋 ---------- */
  function undoRound() {
    if (!game || aiThinking || !game.moves.length) return 0;
    markMode = false; deadSet = {}; finalResult = null;
    $('markBar').classList.remove('on');
    $('resultBox').classList.remove('on');
    game.undo(1);
    var guard = 0;
    while (game.moves.length > 0 && game.toPlay !== cfg.human && guard < 8) {
      game.undo(1); guard++;
    }
    hint('已悔棋，回到你行棋的局面。', '');
    render(); updateSidebar();
    if (!game.ended && game.toPlay !== cfg.human) scheduleAI();
    return 1;
  }

  /* ---------- 终局与数子 ---------- */
  function enterMarkMode() {
    markMode = true; deadSet = {}; finalResult = null;
    var autoUsed = false;
    if (cfg.level === 'hard') {
      var est = game.estimateDead();
      for (var k in est) if (est[k]) { deadSet[k] = true; autoUsed = true; }
    }
    $('markBar').classList.add('on');
    $('resultBox').classList.remove('on');
    $('markTip').textContent = autoUsed
      ? '终局：高级档已预标明显死子（红叉）。点棋子可增删标记，确认后数子。'
      : '终局：点击棋子标记死子（再点一次取消），确认后按数子法计算。';
    hint('双方连续虚手，进入终局。请核对死子标记。', 'on');
    render(); updateSidebar();
  }

  function autoDead() {
    if (!game || !markMode) return;
    var est = game.estimateDead();
    deadSet = {};
    for (var k in est) if (est[k]) deadSet[k] = true;
    hint('已自动预估死子 ' + Object.keys(deadSet).length + ' 子，可继续手动调整。', '');
    render();
  }

  function confirmScore() {
    if (!game || !markMode) return null;
    var res = game.score(deadSet);
    finalResult = { type: 'score', res: res, winner: res.winner };
    markMode = false;
    $('markBar').classList.remove('on');
    var title;
    if (res.winner === 0) title = '和棋';
    else title = (res.winner === BLACK ? '黑棋' : '白棋') + '胜 ' + R.fmtMu(res.margin) + ' 目';
    var detail = '黑方 <b>' + R.fmtZi(res.black) + '</b> 子 ｜ 白方 <b>' + R.fmtZi(res.white) + '</b> 子<br>' +
      '贴目：<b>' + (res.komi > 0 ? R.fmtMu(res.komi) + ' 目（' + R.fmtZi(res.komi / 2) + ' 子）' : '不贴目') + '</b><br>' +
      '标注死子：黑 ' + res.dead[BLACK] + ' 子、白 ' + res.dead[WHITE] + ' 子' +
      (res.neutral ? '<br>公气（各半）：' + res.neutral + ' 点' : '') +
      (res.winner !== 0 ? '<br>胜负：<b>' + (res.winner === BLACK ? '黑' : '白') + '胜 ' + R.fmtZi(res.margin / 2) + ' 子</b>' : '');
    $('resultTitle').textContent = title;
    $('resultDetail').innerHTML = detail;
    $('resultBox').classList.add('on');
    hint('数子完成，可导出棋谱留存。', 'ok');
    render(); updateSidebar();
    return res;
  }

  function resign() {
    if (!game || game.ended || aiThinking) return;
    askConfirm('确认认输', '认输后本局立即结束，胜负将写入棋谱。确定吗？', '认输', function () {
      var loser = game.toPlay;
      var winner = R.other(loser);
      game.ended = true;
      game.result = { type: 'resign', loser: loser, winner: winner };
      finalResult = { type: 'resign', winner: winner, loser: loser };
      if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
      aiThinking = false; markMode = false;
      $('markBar').classList.remove('on');
      $('resultTitle').textContent = (winner === BLACK ? '黑棋' : '白棋') + '中盘胜';
      $('resultDetail').innerHTML = (loser === BLACK ? '黑方' : '白方') + '认输（' +
        (loser === cfg.human ? '你' : 'AI') + '）。<br>已下 <b>' + game.moves.length + '</b> 手，棋谱可完整导出。';
      $('resultBox').classList.add('on');
      hint('对局因认输结束。', 'on');
      render(); updateSidebar();
    });
  }

  /* ---------- SGF 导出 ---------- */
  function pad2(v) { return (v < 10 ? '0' : '') + v; }
  function dateStamp() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fileStamp() {
    var d = new Date();
    return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function buildSGF() {
    if (!game) return '';
    var re = '';
    if (finalResult) {
      if (finalResult.type === 'resign') re = (finalResult.winner === BLACK ? 'B' : 'W') + '+R';
      else re = R.resultSGF(finalResult.res);
    }
    return R.toSGF(game, {
      pb: '玩家',
      pw: 'AI·' + levelName(cfg.level),
      re: re,
      dt: dateStamp()
    });
  }
  function exportName() {
    var tail = '未终局';
    if (finalResult) {
      if (finalResult.type === 'resign') tail = (finalResult.winner === BLACK ? '黑' : '白') + '中盘胜';
      else if (finalResult.type === 'score') {
        tail = finalResult.winner === 0 ? '和棋'
          : (finalResult.winner === BLACK ? '黑' : '白') + '胜' + R.fmtMu(finalResult.res.margin) + '目';
      }
    }
    return '围棋-' + fileStamp() + '-' + tail + '.sgf';
  }
  function doExport() {
    if (!game) return null;
    var text = buildSGF();
    if (!text) return null;
    var name = exportName();
    var blob = new Blob([text], { type: 'application/x-go-sgf;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(url);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 2000);
    hint('棋谱已导出：' + name + '（' + text.length + ' 字节）', 'ok');
    toast('已导出 ' + name);
    return { name: name, text: text };
  }

  /* ---------- 事件绑定 ---------- */
  $('btnStart').onclick = startGame;
  $('btnBackCfg').onclick = function () {
    askConfirm('返回配置界面', '返回配置界面将放弃当前对局（进度不保存），确定吗？', '返回配置', backToConfig);
  };
  $('btnNewGame').onclick = function () {
    askConfirm('重新开局', '重新开局将放弃当前对局（进度不保存），并回到配置界面。确定吗？', '重新开局', backToConfig);
  };
  $('btnPass').onclick = function () { playerPass(); };
  $('btnUndo').onclick = function () { undoRound(); };
  $('btnResign').onclick = resign;
  $('btnExport').onclick = function () { doExport(); };
  $('btnAutoDead').onclick = autoDead;
  $('btnConfirmScore').onclick = confirmScore;

  var cv = $('board');
  cv.addEventListener('click', function (e) {
    if (!game) return;
    var rect = cv.getBoundingClientRect();
    var cxp = e.clientX - rect.left, cyp = e.clientY - rect.top;
    var gx = Math.round((cxp - view.pad) / view.cell);
    var gy = Math.round((cyp - view.pad) / view.cell);
    if (gx < 0 || gy < 0 || gx >= game.size || gy >= game.size) return;
    var dx = cxp - pt(gx), dy = cyp - pt(gy);
    if (Math.sqrt(dx * dx + dy * dy) > view.cell * 0.62) return;
    if (markMode) {
      var p = game.board.get(gx, gy);
      if (!p) { hint('请点击有棋子的交叉点来标记或取消死子。', 'err'); return; }
      var key = gx + ',' + gy;
      if (deadSet[key]) delete deadSet[key]; else deadSet[key] = true;
      hint('已标记死子 ' + Object.keys(deadSet).length + ' 子，确认后数子。', '');
      render();
      return;
    }
    tryPlay(gx, gy);
  });

  window.addEventListener('resize', function () {
    if (!game) return;
    resizeBoard(); render();
  });

  /* ---------- 自动化/质检接口 ---------- */
  window.WQ = {
    rules: R, ai: AI,
    get game() { return game; },
    get config() { return { size: cfg.size, human: cfg.human, level: cfg.level, handicap: cfg.handicap }; },
    get stats() { return stats; },
    levelName: levelName,
    start: function (opt) {
      if (opt) {
        if (opt.size) cfg.size = opt.size;
        if (opt.human) cfg.human = opt.human;
        if (opt.level) cfg.level = opt.level;
        if (opt.handicap !== undefined) cfg.handicap = opt.handicap;
      }
      syncConfigUI();
      startGame();
      return game;
    },
    /* 构造预置局面（不改界面状态，供自动化用例） */
    inject: function (opt) {
      var n = opt.size || 9;
      var g = new R.Game({ size: n, komi: opt.komi !== undefined ? opt.komi : R.KOMI_TABLE[n] });
      var blacks = opt.blacks || [], whites = opt.whites || [];
      for (var i = 0; i < blacks.length; i++) g.board.stones[g.board.idx(blacks[i][0], blacks[i][1])] = BLACK;
      for (var j = 0; j < whites.length; j++) g.board.stones[g.board.idx(whites[j][0], whites[j][1])] = WHITE;
      g.board.hash = 0;
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
        var v = g.board.stones[g.board.idx(x, y)];
        if (v) g.board.hash ^= g.board.z.stone[v][g.board.idx(x, y)];
      }
      g.toPlay = opt.toPlay || BLACK;
      g.moves = []; g.history = [g.board.positionHash(g.toPlay)];
      g.captures = { 1: opt.capB || 0, 2: opt.capW || 0 };
      g.passes = 0; g.ended = false; g.result = null;
      g.handicap = 0;
      return g;
    },
    pick: function (g, level, seed) {
      return AI.choose(g, level, new AI.RNG(seed || 12345));
    },
    /* 调试装局：把预置局面装入界面层（规格第七章允许的调试入口，不计入功能清单） */
    debugLoad: function (opt) {
      var g = window.WQ.inject(opt);
      game = g; rng = new AI.RNG(424242);
      cfg.size = g.size; cfg.handicap = 0;
      markMode = false; deadSet = {}; finalResult = null; aiThinking = false;
      if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
      $('configPanel').style.display = 'none';
      $('gamePanel').style.display = 'flex';
      $('btnBackCfg').style.display = '';
      $('resultBox').classList.remove('on');
      $('markBar').classList.remove('on');
      resizeBoard(); render(); updateSidebar();
      return g;
    },
    exportSGF: function () { return buildSGF(); },
    exportName: exportName,
    download: function () { return doExport(); },
    score: function (dead) { return game ? game.score(dead || {}) : null; },
    ui: {
      tryPlay: tryPlay, undoRound: undoRound, playerPass: playerPass,
      confirmScore: confirmScore, autoDead: autoDead, enterMarkMode: enterMarkMode,
      resignNow: function () {
        if (!game || game.ended) return;
        var loser = game.toPlay, winner = R.other(loser);
        game.ended = true;
        game.result = { type: 'resign', loser: loser, winner: winner };
        finalResult = { type: 'resign', winner: winner, loser: loser };
        aiThinking = false;
        if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
        $('resultTitle').textContent = (winner === BLACK ? '黑棋' : '白棋') + '中盘胜';
        $('resultBox').classList.add('on');
        render(); updateSidebar();
      },
      isMarkMode: function () { return markMode; },
      deadSet: function () { return deadSet; },
      finalResult: function () { return finalResult; },
      setDead: function (keys) { deadSet = {}; for (var i = 0; i < keys.length; i++) deadSet[keys[i]] = true; render(); },
      view: function () { return view; }
    }
  };

  syncConfigUI();
})();
</script>
</body>
</html>
