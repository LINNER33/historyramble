<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>分享图模板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #f5efe3;
    font-family: "STKaiti", "KaiTi", "楷体", "Songti SC", "SimSun", serif;
    color: #2c2416;
    position: relative;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 34px;
    border: 1px solid rgba(139, 69, 19, 0.35);
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(139, 69, 19, 0.16);
  }
  .rule {
    position: absolute;
    left: 88px;
    top: 172px;
    width: 62px;
    height: 3px;
    background: #8b4513;
  }
  .brand {
    position: absolute;
    left: 84px;
    top: 96px;
    font-size: 86px;
    letter-spacing: 0.12em;
    color: #2c2416;
  }
  .tagline {
    position: absolute;
    left: 90px;
    top: 208px;
    font-size: 30px;
    letter-spacing: 0.26em;
    color: #6f6253;
  }
  .lead {
    position: absolute;
    left: 90px;
    top: 300px;
    right: 300px;
    font-size: 40px;
    line-height: 1.7;
    letter-spacing: 0.04em;
    color: #3a3024;
  }
  .columns {
    position: absolute;
    left: 90px;
    bottom: 96px;
    font-size: 21px;
    letter-spacing: 0.2em;
    color: #7a6a54;
  }
  .site {
    position: absolute;
    left: 90px;
    bottom: 58px;
    font-size: 23px;
    letter-spacing: 0.1em;
    color: #8b4513;
  }
  .seal {
    position: absolute;
    right: 96px;
    top: 96px;
    width: 132px;
    height: 132px;
    border: 4px solid #9c3b26;
    color: #9c3b26;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: 0.06em;
    writing-mode: vertical-rl;
    text-orientation: upright;
  }
  .side {
    position: absolute;
    right: 96px;
    top: 300px;
    width: 1px;
    height: 190px;
    background: rgba(139, 69, 19, 0.3);
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="brand">循史漫记</div>
  <div class="rule"></div>
  <div class="tagline">以史的眼光，看人间事</div>
  <div class="lead">唐与高句丽战争 · 史料与专题<br>读史札记 · 人物小传</div>
  <div class="columns">文章 · 专题 · 史料 · 人物 · 书单</div>
  <div class="site">historyramble.org</div>
  <div class="seal">循史</div>
  <div class="side"></div>
</body>
</html>
