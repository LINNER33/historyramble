<script>
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    // 旧链接兼容：存在同名静态页时直接跳转
    if (id && snippets.some(s => s.id === id)) {
        location.replace('snippets/' + encodeURIComponent(id) + '.html');
        return;
    }
    const snippet = snippets.find(s => s.id === id);
    const container = document.getElementById('snippetContent');
    const titleEl = document.getElementById('pageTitle');
    if (!snippet) {
        container.innerHTML = '<h1>史料未找到</h1><p style="color:#6f6253;">请返回<a href="snippets.html">史料列表</a>。</p>';
        return;
    }
    titleEl.textContent = snippet.title + ' — 循史漫记';
    container.innerHTML = `
        <h1>${snippet.title}</h1>
        <div class="article-meta">
            <span class="snippet-source">📜 ${snippet.source}</span>
            <span>${snippet.date}</span>
            <span>${snippet.tags.map(t => `<span class="tag">${t}</span>`).join('')}</span>
        </div>
        <blockquote class="snippet-quote">${snippet.excerpt}</blockquote>
        <p class="snippet-commentary">${snippet.commentary}</p>
        <div style="margin-top:40px;padding-top:20px;border-top:1px solid #d4c5a9;">
            <a href="snippets.html">← 返回史料列表</a>
        </div>
    `;
});
</script>
